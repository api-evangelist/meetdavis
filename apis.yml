name: meetdavis
description: >-
  Davis (meetdavis.com) is an AI-native real estate technology company, backed by Heartcore
  Capital and Balderton Capital, that compresses early-stage real estate development from months to
  days. Davis combines proprietary AI models with human architect expertise to deliver feasibility
  studies (site analysis, regulatory diagnostics, volumetrics, financial modeling) and architectural
  designs (floor plans, unit-mix optimization, space planning) directly to developers and investors.
  Its first proprietary model, Gaudi-1, performs automated architectural generation under regulatory
  and financial constraints. Davis operates as a service model rather than selling software, and
  publishes no public API, developer portal, documentation, or SDKs at this time. This profile was
  added to the API Evangelist network from the Balderton Capital portfolio and has been through the
  enrichment pipeline; no API surface was found.
